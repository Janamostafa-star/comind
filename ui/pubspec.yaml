name: yalla_study
description: AI-powered virtual meeting and study platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  
  # Firebase Backend (Firestore only)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  
  # Charts & Progress
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Date formatting & Calendar
  intl: ^0.19.0
  table_calendar: ^3.0.9
  
  # Text to Speech & Voice
  flutter_tts: ^3.8.3
  speech_to_text: ^7.3.0
  
  # File Picker & Sharing
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  share_plus: ^12.0.1
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  
  # Drawing & Notes
  flutter_drawing_board: ^1.0.1+2
  flutter_colorpicker: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
